# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: geospatial-measurement-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geospatial-db
          property: connectionString # postgres:// is rewritten to postgresql+asyncpg:// by the app
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: UPLOAD_DIR
        value: /app/uploads # ephemeral on the free plan; results live in Postgres (see README)
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: MAX_EXTRACTED_SIZE_MB
        value: "500"
      - key: MAX_ZIP_MEMBERS
        value: "200"
      - key: DEFAULT_PAGE_SIZE
        value: "20"
      - key: MAX_PAGE_SIZE
        value: "100"
      - key: PROCESSING_BATCH_SIZE
        value: "50"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: LIST_DEFAULT_PAGE_SIZE
        value: "20"
      - key: LIST_MAX_PAGE_SIZE
        value: "100"
      # The frontend is built into the image and served from the same origin, so CORS stays off.
      # Set ALLOWED_ORIGINS here only if a separately hosted frontend needs to call this API.
    # To keep raw uploads across deploys, upgrade the plan and attach a disk:
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1

databases:
  - name: geospatial-db
    plan: free
    databaseName: geospatial
    user: geospatial
